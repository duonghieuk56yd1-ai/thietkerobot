; =============================================================================
;  Thí nghiệm sai số Odometry ESP32 (micro-ROS) vs Gazebo
;  ESP32 DevKit + micro-ROS (ROS 2 Humble) qua cổng USB Serial 921600 baud
; =============================================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ---- micro-ROS (3 dòng bắt buộc) ----
board_microros_distro    = humble
board_microros_transport = serial
monitor_speed            = 921600


; micro_ros_platformio nhánh main (commit đã kiểm tra build Humble).
; KHÔNG dùng tag 2.0.0: bản đó cài empy 4.x làm hỏng bước sinh mã của Humble.
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio#cfee17faffaa532363b7151dd13af6a85c69d3c1
